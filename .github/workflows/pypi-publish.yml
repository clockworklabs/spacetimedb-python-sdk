name: Publish to PyPI
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest
    env:
      MY_PACKAGE_VERSION: ${{ github.event.release.tag_name }}
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        # Use a supported Python release for publishing.
        python-version: '3.13'
    - name: Install dependencies
      run: |
        # These minimums remove the compromised emSign CA from pip's and certifi's bundled roots.
        python -m pip install --upgrade 'pip>=26.2.2'
        python -m pip install build twine 'certifi>=2026.10.19'
    - name: Build package
      run: python -m build
    - name: Publish package
      # Publish in this patched environment; the old action used a separate Python container.
      run: python -m twine upload dist/*
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}